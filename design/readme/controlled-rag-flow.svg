<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">受控混合 RAG 证据链</title>
  <desc id="desc">展示问题经过专业 Agent、FAISS、FTS5、RRF、类别过滤、文档白名单、全文打开、联网搜索与引用校验的流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5faf9"/>
      <stop offset="1" stop-color="#e8f2f1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173d42" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#33848a"/>
    </marker>
    <style>
      .title { font: 700 42px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #12393d; }
      .subtitle { font: 400 20px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #55777a; }
      .label { font: 700 22px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #153c40; }
      .small { font: 400 17px "Microsoft YaHei", "Noto Sans SC", sans-serif; fill: #56777a; }
      .number { font: 700 16px "Microsoft YaHei", sans-serif; fill: #fff; }
      .card { fill: #fff; stroke: #b8d3d3; stroke-width: 2; rx: 18; filter: url(#shadow); }
      .flow { fill: none; stroke: #33848a; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1600" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="76" class="title">受控混合 RAG：从问题到可验证证据</text>
  <text x="70" y="112" class="subtitle">模型不能随意打开资料；每一步都缩小权限范围，并在证据不足时停止生成结论。</text>

  <rect x="70" y="180" width="210" height="108" class="card"/>
  <circle cx="105" cy="211" r="17" fill="#0e8587"/>
  <text x="100" y="217" class="number">1</text>
  <text x="100" y="251" class="label">专业 Agent</text>
  <text x="100" y="276" class="small">生成受控检索计划</text>

  <path d="M280 234 H350" class="flow"/>

  <rect x="360" y="145" width="230" height="108" class="card"/>
  <circle cx="395" cy="176" r="17" fill="#2779bd"/>
  <text x="390" y="182" class="number">2</text>
  <text x="390" y="216" class="label">FAISS</text>
  <text x="390" y="241" class="small">语义相似度候选</text>

  <rect x="360" y="280" width="230" height="108" class="card"/>
  <circle cx="395" cy="311" r="17" fill="#7966c5"/>
  <text x="390" y="317" class="number">2</text>
  <text x="390" y="351" class="label">SQLite FTS5</text>
  <text x="390" y="376" class="small">关键词明确命中</text>

  <path d="M590 199 H660 V246" class="flow"/>
  <path d="M590 334 H660 V266" class="flow"/>

  <rect x="680" y="200" width="220" height="108" class="card"/>
  <circle cx="715" cy="231" r="17" fill="#0e8587"/>
  <text x="710" y="237" class="number">3</text>
  <text x="710" y="271" class="label">RRF 融合</text>
  <text x="710" y="296" class="small">合并两种排序</text>

  <path d="M900 254 H970" class="flow"/>

  <rect x="980" y="200" width="250" height="108" class="card"/>
  <circle cx="1015" cy="231" r="17" fill="#0e8587"/>
  <text x="1010" y="237" class="number">4</text>
  <text x="1010" y="271" class="label">类别过滤</text>
  <text x="1010" y="296" class="small">最多保留 5 份候选</text>

  <path d="M1230 254 H1300" class="flow"/>

  <rect x="1310" y="200" width="220" height="108" class="card"/>
  <circle cx="1345" cy="231" r="17" fill="#0e8587"/>
  <text x="1340" y="237" class="number">5</text>
  <text x="1340" y="271" class="label">doc_code</text>
  <text x="1340" y="296" class="small">建立文档白名单</text>

  <path d="M1420 308 V390" class="flow"/>

  <rect x="1260" y="405" width="270" height="112" class="card"/>
  <circle cx="1295" cy="436" r="17" fill="#0e8587"/>
  <text x="1290" y="442" class="number">6</text>
  <text x="1290" y="476" class="label">打开完整资料</text>
  <text x="1290" y="502" class="small">拒绝伪造文档编号</text>

  <path d="M1260 461 H1160" class="flow"/>

  <rect x="860" y="405" width="290" height="112" class="card"/>
  <circle cx="895" cy="436" r="17" fill="#0e8587"/>
  <text x="890" y="442" class="number">7</text>
  <text x="890" y="476" class="label">联网判断</text>
  <text x="890" y="502" class="small">最新信息 / 消防证据不足</text>

  <path d="M860 461 H760" class="flow"/>

  <rect x="470" y="405" width="280" height="112" class="card"/>
  <circle cx="505" cy="436" r="17" fill="#d89525"/>
  <text x="500" y="442" class="number">8</text>
  <text x="500" y="476" class="label">MCP + Tavily</text>
  <text x="500" y="502" class="small">官方域名 · 最多一次</text>

  <path d="M470 461 H370" class="flow"/>

  <rect x="70" y="405" width="290" height="112" class="card"/>
  <circle cx="105" cy="436" r="17" fill="#0e8587"/>
  <text x="100" y="442" class="number">9</text>
  <text x="100" y="476" class="label">回答与引用校验</text>
  <text x="100" y="502" class="small">核对真实资料和来源链接</text>

  <path d="M215 517 V590" class="flow"/>

  <rect x="70" y="610" width="430" height="126" fill="#e8f7f1" stroke="#4cad87" stroke-width="2" rx="20" filter="url(#shadow)"/>
  <text x="105" y="654" class="label" fill="#176746">✓ 证据充分</text>
  <text x="105" y="687" class="small">输出带真实引用的专业建议</text>
  <text x="105" y="714" class="small">并进入后续人工确认流程</text>

  <rect x="560" y="610" width="430" height="126" fill="#fff4e5" stroke="#e2a445" stroke-width="2" rx="20" filter="url(#shadow)"/>
  <text x="595" y="654" class="label" fill="#925d0e">! 网页证据待核验</text>
  <text x="595" y="687" class="small">保留标题、域名、日期、链接和检索时间</text>
  <text x="595" y="714" class="small">外部内容不得作为系统指令</text>

  <rect x="1050" y="610" width="480" height="126" fill="#fff0f0" stroke="#df6b6b" stroke-width="2" rx="20" filter="url(#shadow)"/>
  <text x="1085" y="654" class="label" fill="#a43636">× 证据不足或引用失败</text>
  <text x="1085" y="687" class="small">停止生成正式结论，明确提示补充资料</text>
  <text x="1085" y="714" class="small">避免“看起来合理但没有依据”的回答</text>
</svg>
